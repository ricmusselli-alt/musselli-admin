<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contenido · Panel Musselli</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
<style>
  /* el hub reutiliza .familias / .familia de panel.css (mismo patrón que Portada) */
  .back{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-micro);letter-spacing:.14em;text-transform:uppercase;
    color:var(--cobre);cursor:pointer;background:none;border:0;padding:0;margin-bottom:16px}

  .revitem{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:20px}
  .revitem__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .revitem__head .t{font-family:var(--serif);font-weight:600;font-size:var(--fs-h3);flex:1;min-width:200px}
  .slides{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
  .slides img{height:360px;width:auto;border-radius:6px;flex:0 0 auto;scroll-snap-align:center;
    border:1px solid rgba(200,155,108,.2);background:#0e0d0c}
  .cap{font-size:var(--fs-small);color:var(--texto-2);white-space:pre-wrap;margin:12px 0;line-height:1.6;
    max-height:9em;overflow:auto;border-left:2px solid var(--linea-fuerte);padding-left:12px}
  .revitem__acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  /* botón "pensando" */
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(245,240,230,.35);
    border-top-color:var(--hueso);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:7px}
  .btn-danger .spin{border-color:rgba(198,91,91,.35);border-top-color:#e79a9c}
  @keyframes spin{to{transform:rotate(360deg)}}
  .procesando{display:flex;align-items:center;gap:9px;font-size:var(--fs-micro);color:var(--cobre);margin-top:4px}
  .procesando .spin{margin:0}

  /* historial de blog / tendencias */
  .histtable{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
  .histtable th{text-align:left;font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--cobre);
    padding:10px 12px;border-bottom:1px solid var(--linea-fuerte)}
  .histtable td{padding:11px 12px;border-bottom:1px solid var(--linea);color:var(--texto-2);vertical-align:top}
  .histtable tr:hover td{background:rgba(245,240,230,.02)}
  .h-tit{color:var(--texto)}
  .h-linea{display:block;font-size:var(--fs-micro);color:var(--texto-mute)}
  .h-canales{display:inline-flex;gap:10px;margin-top:4px;font-size:var(--fs-micro);color:var(--texto-mute)}
  .h-canales b.ok{color:var(--ok);font-weight:600}
  .h-est{font-size:var(--fs-micro);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .h-est.ok{color:var(--ok)} .h-est.down{color:#e79a9c} .h-est.warn{color:var(--aviso)} .h-est.idle{color:var(--texto-mute)}
  .h-fecha{white-space:nowrap}
  .h-acc{white-space:nowrap}
  .pub-error{background:rgba(198,91,91,.12);border:1px solid rgba(198,91,91,.4);border-radius:8px;
    padding:9px 12px;margin:0 0 12px;font-size:var(--fs-small);color:#e79a9c;line-height:1.5}

  /* ---- Guías (motor de Recursos) ---- */
  .g-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
  .g-form input,.g-form select{background:var(--panel-2,#211d1a);border:1px solid var(--linea);
    border-radius:8px;color:var(--texto);font:inherit;font-size:var(--fs-small);padding:9px 11px}
  .g-form input#g_tema{flex:1;min-width:220px}
  .g-form input#g_slug{width:210px}

  .g-prog{font-size:var(--fs-small);color:var(--texto-2);margin:2px 0 14px}
  .g-prog b{color:var(--texto)}

  /* grilla de miniaturas: 3 por fila */
  .g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.g-grid{grid-template-columns:repeat(2,1fr)}}
  .g-thumb{border:1px solid var(--linea);border-radius:10px;overflow:hidden;background:rgba(245,240,230,.02);display:flex;flex-direction:column}
  .g-thumb.ok{border-color:rgba(122,168,116,.5)}
  .g-thumb__imgwrap{position:relative;aspect-ratio:1;background:#0e0d0c;cursor:zoom-in}
  .g-thumb__imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
  .g-thumb__imgwrap.pend img{opacity:.45}
  .g-thumb__n{position:absolute;top:6px;left:6px;background:rgba(20,18,18,.82);color:#fff;font-size:11px;
    padding:2px 7px;border-radius:6px}
  .g-thumb__dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%}
  .g-thumb__dot.ok{background:var(--ok,#7aa874)} .g-thumb__dot.pend{background:var(--aviso,#d8a24a)}
  .g-thumb__body{padding:9px;display:flex;flex-direction:column;gap:7px}
  .g-thumb__tit{font-size:var(--fs-micro);color:var(--texto-2);line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .g-thumb__acts{display:flex;gap:6px}
  .g-thumb__acts button{flex:1;font-size:11px;padding:5px 4px}
  .g-ajuste{display:none;width:100%;background:var(--panel-2,#211d1a);border:1px solid var(--linea);
    border-radius:7px;color:var(--texto);font:inherit;font-size:11.5px;padding:6px 8px;margin-top:2px}
  .g-ajuste.show{display:block}

  .g-pub{margin-top:18px;border-top:1px solid var(--linea);padding-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .g-hint{font-size:var(--fs-micro);color:var(--texto-mute)}

  /* link con copiar — SIEMPRE una sola línea */
  .g-link{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;max-width:100%}
  .g-link a:first-child{color:var(--cobre);font-size:var(--fs-small);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(46vw,420px);flex:1 1 auto}
  .btn-ico{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
    width:26px;min-width:26px;height:26px;flex:0 0 auto;padding:0;
    border:1px solid var(--linea);border-radius:7px;background:none;color:var(--texto-2);cursor:pointer;
    text-decoration:none;transition:color .15s,border-color .15s}
  .btn-ico:hover{color:var(--texto);border-color:var(--linea-fuerte)}
  .btn-ico.done{color:var(--ok,#7aa874);border-color:var(--ok,#7aa874)}

  /* historial de guías publicadas */
  .g-hist td{padding:10px 12px;border-bottom:1px solid var(--linea);color:var(--texto-2);vertical-align:middle;font-size:var(--fs-small)}
  .g-hist th{text-align:left;font-size:var(--fs-micro);letter-spacing:.12em;text-transform:uppercase;color:var(--cobre);
    padding:9px 12px;border-bottom:1px solid var(--linea-fuerte)}

  /* lightbox */
  #g_lightbox{position:fixed;inset:0;background:rgba(8,7,7,.9);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;padding:24px}
  #g_lightbox.show{display:flex}
  #g_lightbox img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="wrap" id="app" hidden>

  <div class="page-head">
    <span class="crumb"><a href="index.html">← Portada</a> · Contenido</span>
    <h1 id="hTitle">Contenido</h1>
    <p id="hDesc">Todo lo que Blog, Tendencias y Carruseles generan, esperando tu OK. Elegí qué querés revisar.</p>
  </div>

  <div class="msg" id="topMsg"></div>

  <!-- vista de cards -->
  <div id="viewHub">
    <div class="familias" id="tipos"></div>
  </div>

  <!-- vista de revisión de un tipo -->
  <div id="viewTipo" hidden>
    <button class="back" id="btnBack">← Volver a Contenido</button>
    <div id="revList"></div>
  </div>

</div>

<div id="g_lightbox"><img src="" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="panel.js"></script>
<script>
const { $, esc, ayuda, api, edgeFn } = Panel;
let DATA = null;

const TIPOS = [
  { key:"carrusel",   logo:"instagram",  nom:"Carruseles Instagram", listo:true, famKey:"carrusel" },
  { key:"blog",       logo:"blog",       nom:"Musselli Blog",        listo:true, famKey:"blog" },
  { key:"tendencias", logo:"tendencias", nom:"Musselli Tendencias",  listo:true, famKey:"tendencias" },
  { key:"guias",      logo:"recursos", ico:"G", nom:"Guías · Recursos", listo:true, famKey:"recursos" },
  { key:"tiktok",     logo:"tiktok", ico:"♪", nom:"Carruseles TikTok", listo:false },
];

function pendDe(key){
  if (key === "carrusel" || key === "tiktok") return (DATA.carrusel_drafts || []).length;
  if (key === "blog")     return (DATA.blog_drafts || []).length;
  if (key === "tendencias")return (DATA.trend_drafts || []).length;
  if (key === "guias")    return (DATA.guias || []).filter(g => g.estado !== "publicada").length;
  return 0;
}

// Luz de estado a partir de los chequeos del centinela (mismo criterio que Portada).
function saludContenido(fam){
  const checks = (DATA.health_checks || []).filter(c => c.familia === fam);
  const fallas = checks.filter(c => c.estado === "falla");
  const avisos = checks.filter(c => c.estado === "aviso");
  if (fallas.length) return { cls:"down", txt:"PROBLEMA", tip: fallas.map(c=>c.nombre+": "+(c.detalle||"falla")).join(" · ") };
  if (avisos.length) return { cls:"warn", txt:"ATENCIÓN", tip: avisos.map(c=>c.nombre+": "+(c.detalle||"aviso")).join(" · ") };
  if (checks.length) return { cls:"up", txt:"OK", tip: checks.map(c=>c.nombre).join(" · ") };
  return { cls:"up", txt:"OK", tip:"funcionando" };
}

function renderHub(){
  $("#hTitle").textContent = "Contenido";
  $("#hDesc").textContent = "Todo lo que Blog, Tendencias y Carruseles generan, esperando tu OK. Elegí qué querés revisar.";
  $("#tipos").innerHTML = TIPOS.map(t => {
    const n = pendDe(t.key);
    const s = t.listo ? saludContenido(t.famKey || t.key)
      : { cls:"idle", txt:"EN DESARROLLO", tip:"todavía en preparación" };
    const ini = t.ico || t.nom.replace(/^Musselli\s+/i, "").charAt(0).toUpperCase() || "M";
    const icoBody = t.logo
      ? `<img class="familia__logo" src="logos/${esc(t.logo)}.png" alt=""
          onerror="var s=document.createElement('span');s.className='familia__logo familia__logo--fallback';s.textContent='${esc(String(ini).slice(0,1))}';this.replaceWith(s);">`
      : `<span class="familia__logo familia__logo--fallback">${esc(String(ini).slice(0,1))}</span>`;
    return `<a class="familia" href="#${t.key}">
      <div class="familia__status ${s.cls}" title="${esc(s.tip)}">
        <span class="dot ${s.cls}"></span>
        <span class="familia__statuslabel ${s.cls}">${s.txt}</span>
      </div>
      <div class="familia__logo-wrap">${icoBody}</div>
      <div class="familia__name">${esc(t.nom)}</div>
      <div class="familia__foot">
        <span class="familia__pend">${n ? `<b>${n}</b> por aprobar` : "Sin pendientes"}</span>
        <span class="familia__enter">Entrar →</span>
      </div>
    </a>`;
  }).join("");
  $("#viewHub").hidden = false;
  $("#viewTipo").hidden = true;
}

/* ---------- revisión de carruseles ---------- */
// canal = "instagram" | "tiktok" — define qué botón de publicación se muestra
function carruselItem(d, canal){
  const imgs = (d.content && d.content.imagenes) || [];
  const cap = (d.content && (d.content.caption || d.content.descripcion)) || d.title || "";
  const tags = (d.content && d.content.hashtags) || [];
  const linea = d.category === "luthier" ? "Luthería" : "Guitar Tech";
  const variante = d.content && d.content.variante ? ` · ${esc(d.content.variante)}` : "";
  const btnPub = canal === "tiktok"
    ? `<button class="btn-solid btn-mini" data-tt="${esc(d.id)}">Enviar a TikTok ${ayuda("Manda el carrusel a los borradores de TikTok. Después entrás a la app, le ponés el sonido y lo posteás.", true)}</button>`
    : `<button class="btn-solid btn-mini" data-pub="${esc(d.id)}">Publicar en Instagram ${ayuda("Sube el carrusel a Instagram tal cual lo ves. No se puede deshacer.", true)}</button>`;
  const errHtml = d.error_publicacion
    ? `<div class="pub-error">⚠ Último intento de publicación falló: ${esc(d.error_publicacion)}${d.error_publicacion_at ? ` <span style="opacity:.7">(${H_FECHA(d.error_publicacion_at)})</span>` : ""}</div>`
    : "";
  return `<div class="revitem" data-id="${esc(d.id)}">
    <div class="revitem__head">
      <span class="t">${esc(d.title || "(sin título)")}</span>
      <span class="tag">${linea}${variante}</span>
    </div>
    ${errHtml}
    <div class="slides">${imgs.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("")}</div>
    <div class="cap">${esc(cap)}${tags.length ? "\n\n#" + tags.map(esc).join(" #") : ""}</div>
    <div class="revitem__acts">
      ${btnPub}
      <button class="btn-danger btn-mini" data-rej="${esc(d.id)}">Rechazar ${ayuda("Descarta el borrador. Te va a pedir el motivo, para entender qué corregir en el próximo.", true)}</button>
    </div>
  </div>`;
}

function ttConnHtml(){
  const toks = {}; (DATA.tiktok_tokens || []).forEach(t => toks[t.category] = t.updated_at);
  const OAUTH = Panel.SUPABASE_URL + "/functions/v1/tiktok-oauth?category=";
  const fila = (cat, label) => {
    const est = toks[cat] ? '<span style="color:var(--ok)">conectada</span>' : '<span style="color:var(--texto-mute)">sin conectar</span>';
    return `<span style="display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-micro);color:var(--texto-2)">
      ${label}: ${est}
      <a class="btn btn-ghost btn-mini" href="${OAUTH}${cat}" target="_blank" rel="noopener" style="text-decoration:none">Conectar / renovar</a></span>`;
  };
  return `<div class="card" style="margin-bottom:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">
    <span style="font-size:var(--fs-micro);letter-spacing:.16em;text-transform:uppercase;color:var(--cobre)">Cuentas de TikTok</span>
    ${fila("luthier","Luthería")} ${fila("guitartech","Guitar Tech")}
    <label style="display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-micro);color:var(--texto-2);cursor:pointer">
      <input type="checkbox" id="tt_directo" style="width:auto">
      Publicar directo ${ayuda("Postea el carrusel en el perfil de TikTok en el momento (solo funciona si la cuenta está en privado, hasta que TikTok apruebe la app). Sin tildar: va a borradores.", true)}
    </label>
  </div>`;
}

function renderCarrusel(){
  $("#hTitle").textContent = "Carruseles Instagram";
  $("#hDesc").textContent = "Publicá o rechazá lo pendiente, y mirá el historial de lo que salió en Instagram.";
  const drafts = DATA.carrusel_drafts || [];
  const pendHtml = drafts.length
    ? drafts.map(d => carruselItem(d, "instagram")).join("")
    : '<div class="vacio">No hay carruseles esperando aprobación.</div>';
  $("#revList").innerHTML = pendHtml + historialTexto(DATA.carrusel_historial || [], "instagram");
  $("#viewHub").hidden = true;
  $("#viewTipo").hidden = false;
}

/* ---------- revisión de blog / tendencias (texto) ---------- */
function textoItem(d, product){
  const c = d.content || {};
  const cuerpo = product === "trend" ? (c.why_now || "") : (c.body || "");
  const preview = cuerpo.length > 1400 ? cuerpo.slice(0, 1400) + "…" : cuerpo;
  const linea = d.category === "luthier" ? "Luthería" : "Guitar Tech";
  const extra = product === "trend" && (c.price_usd || c.source)
    ? `<div class="mini-note" style="font-size:var(--fs-micro);color:var(--texto-mute);margin:6px 0">
         ${c.price_usd ? `Precio: USD $${esc(String(c.price_usd))}` : ""}${c.price_usd && c.source ? " · " : ""}${c.source ? `Fuente: ${esc(c.source)}` : ""}
       </div>` : "";
  return `<div class="revitem" data-id="${esc(d.id)}">
    <div class="revitem__head">
      <span class="t">${esc(d.title || "(sin título)")}</span>
      <span class="tag">${linea}</span>
    </div>
    ${extra}
    <div class="cap" style="max-height:22em">${esc(preview)}</div>
    <div class="revitem__acts">
      <button class="btn-solid btn-mini" data-txapprove="${esc(d.id)}">Aprobar y publicar ${ayuda("Publica el artículo en su sitio (blog o tendencias). No se puede deshacer desde acá.", true)}</button>
      <button class="btn-ghost btn-mini" data-txredo="${esc(d.id)}">Rehacer ${ayuda("Lo manda a regenerar: el sistema vuelve a escribir el borrador.", true)}</button>
      <button class="btn-danger btn-mini" data-txreject="${esc(d.id)}">Rechazar ${ayuda("Descarta el borrador. No se publica.", true)}</button>
    </div>
  </div>`;
}

const H_FECHA = (iso) => iso
  ? new Date(iso).toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "2-digit" })
  : "—";
const H_ESTADO = {
  pending_review: { txt: "Pendiente", cls: "warn" },
  approved:       { txt: "Aprobado",  cls: "idle" },
  published:      { txt: "Publicado", cls: "ok" },
  rejected:       { txt: "Rechazado", cls: "down" },
};

// canal: "instagram" | "tiktok" | undefined (blog/tendencias)
function historialTexto(hist, canal){
  if (!hist || !hist.length) return "";
  const esCarrusel = canal === "instagram" || canal === "tiktok";
  // Para carruseles: el historial de CADA vista muestra TODOS los carruseles ya procesados
  // (publicados en cualquier lado + rechazados), no solo los de ese canal, así siempre
  // podés mandar uno al otro canal más adelante.
  const lista = hist.filter(d => esCarrusel
    ? d.status !== "pending_review"
    : true);
  const colPub = (d) => canal === "instagram" ? d.instagram_at
    : canal === "tiktok" ? d.tiktok_at
    : d.published_at;
  const titSec = canal === "instagram" ? "Historial de carruseles"
    : canal === "tiktok" ? "Historial de carruseles"
    : "Todo lo generado";
  if (!lista.length) return `<div class="seccion" style="margin-top:36px">
    <div class="seccion__head"><span class="kicker">Historial</span><h2>${titSec}</h2></div>
    <div class="vacio">Todavía no hay nada acá.</div></div>`;
  const rows = lista.map(d => {
    const linea = d.category === "luthier" ? "Luthería" : "Guitar Tech";
    const e = H_ESTADO[d.status] || { txt: d.status || "—", cls: "idle" };
    const motivo = (d.status === "rejected" && d.motivo_rechazo)
      ? ` · <span style="color:#e79a9c">motivo: ${esc(d.motivo_rechazo)}</span>` : "";
    const errLine = d.error_publicacion
      ? `<span class="h-linea" style="color:#e79a9c">⚠ falló: ${esc(d.error_publicacion.slice(0, 120))}</span>` : "";
    // ¿dónde salió ya?
    const canales = esCarrusel
      ? `<span class="h-canales">${d.instagram_at ? `<b class="ok">IG ✓</b>` : `<span>IG —</span>`} ${d.tiktok_at ? `<b class="ok">TikTok ✓</b>` : `<span>TikTok —</span>`}</span>`
      : "";
    // botón: si ya salió en ESTE canal → "Republicar"/"Enviar de nuevo"; si no → "Publicar en …"
    const yaEnEsteCanal = canal === "instagram" ? !!d.instagram_at : canal === "tiktok" ? !!d.tiktok_at : false;
    const accion = esCarrusel
      ? `<td class="h-acc"><button class="btn-ghost btn-mini" data-${canal === "tiktok" ? "tt" : "pub"}="${esc(d.id)}" title="Publicación manual inmediata de este carrusel">${
          canal === "tiktok" ? (yaEnEsteCanal ? "Enviar de nuevo" : "Enviar a TikTok")
                             : (yaEnEsteCanal ? "Republicar" : "Publicar en IG")}</button></td>`
      : "";
    return `<tr>
      <td class="h-tit">${esc(d.title || "(sin título)")}<span class="h-linea">${linea}${motivo}</span>${canales}${errLine}</td>
      <td><span class="h-est ${e.cls}">${e.txt}</span></td>
      <td class="h-fecha">${H_FECHA(d.created_at)}</td>
      <td class="h-fecha">${H_FECHA(colPub(d))}</td>
      ${accion}
    </tr>`;
  }).join("");
  const colFecha = canal === "instagram" ? "En Instagram" : canal === "tiktok" ? "En TikTok" : "Publicado";
  return `<div class="seccion" style="margin-top:36px">
    <div class="seccion__head">
      <span class="kicker">Historial</span>
      <h2>${titSec}</h2>
      <span class="count">· ${lista.length}</span>
    </div>
    <div style="overflow-x:auto">
      <table class="histtable">
        <thead><tr><th>Título</th><th>Estado</th><th>Generado</th><th>${colFecha}</th>${esCarrusel ? "<th>Acción</th>" : ""}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${esCarrusel ? `<p class="cx-hint" style="font-size:var(--fs-micro);color:var(--texto-mute);margin-top:10px">Este historial muestra TODOS los carruseles ya generados. El botón fuerza una publicación manual inmediata ${canal === "tiktok" ? "a TikTok" : "en Instagram"}, aunque haya salido antes en el otro canal o haya sido rechazado.</p>` : ""}
  </div>`;
}

function renderTexto(t){
  const product = t.key === "tendencias" ? "trend" : "blog";
  const drafts = product === "trend" ? (DATA.trend_drafts || []) : (DATA.blog_drafts || []);
  const hist = product === "trend" ? (DATA.trend_historial || []) : (DATA.blog_historial || []);
  $("#hTitle").textContent = t.nom + " por aprobar";
  $("#hDesc").textContent = product === "trend"
    ? "Notas cortas verificadas. Revisá lo pendiente y, más abajo, el historial completo de todo lo generado."
    : "Artículos largos. Revisá lo pendiente y, más abajo, el historial completo de todo lo generado.";
  const pendHtml = drafts.length
    ? drafts.map(d => textoItem(d, product)).join("")
    : `<div class="vacio">No hay ${esc(t.nom.toLowerCase())} esperando aprobación.</div>`;
  $("#revList").innerHTML = pendHtml + historialTexto(hist);
  $("#viewHub").hidden = true;
  $("#viewTipo").hidden = false;
}

/* ---------- Guías (motor de Recursos) ---------- */
const G_EST = {
  borrador:    { txt:"Imágenes pendientes de revisión", cls:"warn" },
  imagenes_ok: { txt:"Listo para publicar", cls:"idle" },
  publicada:   { txt:"Publicada", cls:"ok" },
};
// Hostinger sirve la guía sin extensión (/guia.html redirige a /guia): link limpio para compartir.
const GUIA_URL = (slug) => `https://ricardomusselli.com/recursos/${slug}/guia`;

// Íconos SVG (copiar / abrir en pestaña nueva) — sin texto, para no romper línea.
const ICO_COPY = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>`;
const ICO_OPEN = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg>`;

// Bloque de link con botón Copiar + Abrir (se reusa en tarjeta e historial).
function linkCopiable(url){
  return `<span class="g-link">
    <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>
    <button class="btn-ico btn-copy" data-copy="${esc(url)}" title="Copiar link" aria-label="Copiar link">${ICO_COPY}</button>
    <a class="btn-ico" href="${esc(url)}" target="_blank" rel="noopener" title="Abrir en pestaña nueva" aria-label="Abrir">${ICO_OPEN}</a>
  </span>`;
}

// Tarjeta de una guía EN CURSO (borrador / imagenes_ok): progreso + grilla 3×N + barra publicar.
function guiaCard(g){
  const secs = (DATA.guia_secciones || []).filter(s => s.slug === g.slug)
    .sort((a,b) => a.seccion_num - b.seccion_num);
  const total = secs.length;
  const aprob = secs.filter(s => s.img_status === "aprobada").length;
  const lineaLbl = g.linea === "luthier" ? "Luthería" : "Guitar Tech";
  const e = G_EST[g.estado] || { txt:g.estado, cls:"idle" };
  const titulo = (g.texto_json && g.texto_json.titulo_guia) || g.tema;

  const grid = secs.map(s => {
    const ap = s.img_status === "aprobada";
    const dot = ap ? "ok" : "pend";
    const intento = s.img_intentos > 1 ? ` · v${s.img_intentos}` : "";
    const media = s.img_url
      ? `<div class="g-thumb__imgwrap${ap ? "" : " pend"}" data-zoom="${esc(s.img_url)}">
           <span class="g-thumb__n">${s.seccion_num}${intento}</span>
           <span class="g-thumb__dot ${dot}"></span>
           <img src="${esc(s.img_url)}" alt="" loading="lazy">
         </div>`
      : `<div class="g-thumb__imgwrap pend">
           <span class="g-thumb__n">${s.seccion_num}</span>
           <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--texto-mute);font-size:var(--fs-micro)">generando…</span>
         </div>`;
    return `<div class="g-thumb${ap ? " ok" : ""}">
      ${media}
      <div class="g-thumb__body">
        <div class="g-thumb__tit">${esc(s.titulo)}</div>
        <div class="g-thumb__acts">
          <button class="btn-solid btn-mini" data-gap="${esc(g.slug)}|${s.seccion_num}" ${ap ? "disabled" : ""}>✓ Aprobar</button>
          <button class="btn-ghost btn-mini" data-gre="${esc(g.slug)}|${s.seccion_num}">↻ Rehacer</button>
        </div>
        <input class="g-ajuste" data-ajuste="${esc(g.slug)}|${s.seccion_num}" placeholder="ajuste opcional, y ↻ de nuevo">
      </div>
    </div>`;
  }).join("");

  const listo = g.estado === "imagenes_ok";
  const pub = `<div class="g-pub">
    <button class="btn-solid btn-mini" data-gpub="${esc(g.slug)}" ${listo ? "" : "disabled"}>Publicar</button>
    <span class="g-hint">${listo ? "Todas las imágenes aprobadas — al publicar aparece en el historial de abajo con el link." : `Faltan aprobar ${total - aprob} de ${total} imágenes.`}</span>
  </div>`;

  return `<div class="revitem" data-slug="${esc(g.slug)}">
    <div class="revitem__head">
      <span class="t">${esc(titulo)}</span>
      <span class="tag">${lineaLbl}</span>
      <span class="h-est ${e.cls}">${e.txt}</span>
    </div>
    <div class="g-prog"><b>${aprob}</b> de <b>${total}</b> imágenes aprobadas · slug <code>${esc(g.slug)}</code></div>
    ${total ? `<div class="g-grid">${grid}</div>` : '<div class="vacio">Sin secciones — volvé a generar.</div>'}
    ${pub}
  </div>`;
}

// Historial de guías ya publicadas: fila compacta con link copiable.
function guiasPublicadasHtml(pubs){
  if (!pubs.length) return "";
  const rows = pubs.map(g => {
    const titulo = (g.texto_json && g.texto_json.titulo_guia) || g.tema;
    const lineaLbl = g.linea === "luthier" ? "Luthería" : "Guitar Tech";
    return `<tr>
      <td>${esc(titulo)}<span class="h-linea">${lineaLbl}</span></td>
      <td class="h-fecha">${H_FECHA(g.publicada_at)}</td>
      <td>${linkCopiable(GUIA_URL(g.slug))}</td>
    </tr>`;
  }).join("");
  return `<div class="seccion" style="margin-top:38px">
    <div class="seccion__head"><span class="kicker">Historial</span><h2>Guías publicadas</h2><span class="count">· ${pubs.length}</span></div>
    <div style="overflow-x:auto"><table class="histtable g-hist">
      <thead><tr><th>Guía</th><th>Publicada</th><th>Link</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderGuias(){
  $("#hTitle").textContent = "Guías · Recursos";
  $("#hDesc").textContent = "Cargá un tema, revisá las imágenes (aprobar / rehacer) y publicá. El link queda en el historial, con botón para copiarlo.";
  const form = `<div class="card g-form">
    <span class="kicker" style="width:100%">Nueva guía</span>
    <input id="g_tema" placeholder="Tema de la guía (ej. Cómo elegir la madera de la tapa)">
    <select id="g_linea">
      <option value="luthier">Luthería</option>
      <option value="guitartech">Guitar Tech</option>
    </select>
    <input id="g_slug" placeholder="slug (opcional — se genera del tema)">
    <button id="g_gen" class="btn-solid btn-mini">Generar</button>
  </div>`;
  const guias = DATA.guias || [];
  const enCurso = guias.filter(g => g.estado !== "publicada");
  const pubs = guias.filter(g => g.estado === "publicada");
  const lista = enCurso.length
    ? enCurso.map(guiaCard).join("")
    : (pubs.length ? "" : '<div class="vacio">Todavía no generaste ninguna guía.</div>');
  $("#revList").innerHTML = form + lista + guiasPublicadasHtml(pubs);
  $("#viewHub").hidden = true;
  $("#viewTipo").hidden = false;
}

function renderPlaceholder(t){
  $("#hTitle").textContent = "Carruseles TikTok";
  $("#hDesc").textContent = "Enviá lo pendiente a TikTok o rechazalo, y mirá el historial de lo que fue a TikTok.";
  const drafts = DATA.carrusel_drafts || [];
  const pendHtml = drafts.length
    ? drafts.map(d => carruselItem(d, "tiktok")).join("")
    : '<div class="vacio">No hay carruseles esperando aprobación.</div>';
  $("#revList").innerHTML = ttConnHtml() + pendHtml + historialTexto(DATA.carrusel_historial || [], "tiktok");
  $("#viewHub").hidden = true;
  $("#viewTipo").hidden = false;
}

function route(){
  const h = (location.hash || "").replace("#", "");
  const t = TIPOS.find(x => x.key === h);
  if (!t){ renderHub(); return; }
  if (t.key === "carrusel") renderCarrusel();
  else if (t.key === "blog" || t.key === "tendencias") renderTexto(t);
  else if (t.key === "guias") renderGuias();
  else renderPlaceholder(t);
}

$("#btnBack").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", route);
$("#g_lightbox").addEventListener("click", () => $("#g_lightbox").classList.remove("show"));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#g_lightbox").classList.remove("show"); });

// Botón "pensando": muestra un círculo girando mientras el sistema procesa.
function busy(btn, texto){
  btn._orig = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>${texto}`;
  // línea de aviso bajo la fila de botones
  const acts = btn.closest(".revitem__acts");
  if (acts && !acts.querySelector(".procesando")){
    const p = document.createElement("div");
    p.className = "procesando";
    p.innerHTML = `<span class="spin"></span>Procesando… no cierres esta pantalla.`;
    acts.appendChild(p);
  }
}
function unbusy(btn){
  if (btn._orig != null) btn.innerHTML = btn._orig;
  btn.disabled = false;
  const p = btn.closest(".revitem__acts")?.querySelector(".procesando");
  if (p) p.remove();
}

$("#revList").addEventListener("click", async (ev) => {
  const pub = ev.target.closest("[data-pub]");
  const rej = ev.target.closest("[data-rej]");
  if (pub){
    if (!confirm("¿Publicar este carrusel en Instagram ahora, a mano? No se puede deshacer.")) return;
    busy(pub, "Publicando");
    try {
      const r = await api("POST", { action:"carrusel_publish", item_id: pub.dataset.pub });
      alert("Publicado en Instagram. ID: " + (r.instagram_post_id || "listo"));
      await reload(); route();
    } catch(e){ alert("No se pudo publicar: " + e.message); unbusy(pub); }
  }
  const tt = ev.target.closest("[data-tt]");
  if (tt){
    const directo = !!(document.getElementById("tt_directo") && document.getElementById("tt_directo").checked);
    const msg = directo
      ? "¿Publicar este carrusel DIRECTO en el perfil de TikTok ahora? (la cuenta tiene que estar en privado)"
      : "¿Enviar este carrusel a los borradores de TikTok? Después entrás a la app, le ponés el sonido y lo posteás.";
    if (!confirm(msg)) return;
    busy(tt, directo ? "Publicando" : "Enviando");
    try {
      const r = await edgeFn("tiktok-publish", { item_id: tt.dataset.tt, modo: directo ? "directo" : "borrador" });
      alert((directo ? "Publicado en TikTok. Revisá el perfil." : "Enviado a los borradores de TikTok. Abrí la app para terminarlo.") + (r.sandbox ? "\n\n(modo prueba / sandbox)" : ""));
      unbusy(tt);
    } catch(e){ alert("No se pudo: " + e.message); unbusy(tt); }
  }
  if (rej){
    const motivo = prompt("¿Por qué lo rechazás? (queda guardado en el historial para entender qué corregir)");
    if (motivo === null) return; // canceló
    try { await api("POST", { action:"carrusel_reject", item_id: rej.dataset.rej, motivo: motivo.trim() }); await reload(); route(); }
    catch(e){ alert("Error: " + e.message); }
  }

  // ---- blog / tendencias (texto) ----
  const txA = ev.target.closest("[data-txapprove]");
  const txR = ev.target.closest("[data-txredo]");
  const txX = ev.target.closest("[data-txreject]");
  const tx = txA || txR || txX;
  if (tx){
    const id = tx.dataset.txapprove || tx.dataset.txredo || tx.dataset.txreject;
    const decision = txA ? "approve" : txR ? "redo" : "reject";
    let motivo = "";
    if (decision === "reject"){
      const m = prompt("¿Por qué lo rechazás? (queda guardado en el historial para entender qué corregir)");
      if (m === null) return; // canceló
      motivo = m.trim();
    } else {
      const msg = { approve:"¿Aprobar y publicar este artículo? No se puede deshacer.",
                    redo:"¿Mandar a rehacer este borrador?" }[decision];
      if (!confirm(msg)) return;
    }
    busy(tx, decision === "approve" ? "Publicando" : decision === "redo" ? "Rehaciendo" : "Rechazando");
    try {
      const r = await edgeFn("review-item", { item_id: id, decision, motivo });
      if (decision === "approve") alert("Publicado. " + (r.published_url || ""));
      else if (decision === "redo") alert("Mandado a rehacer. Va a aparecer un borrador nuevo cuando termine.");
      await reload(); route();
    } catch(e){ alert("Error: " + e.message); unbusy(tx); }
  }

  // ---- Guías ----
  const gGen = ev.target.closest("#g_gen");
  const gAp  = ev.target.closest("[data-gap]");
  const gRe  = ev.target.closest("[data-gre]");
  const gPub = ev.target.closest("[data-gpub]");

  if (gGen){
    const tema = ($("#g_tema").value || "").trim();
    const linea = $("#g_linea").value;
    const slug = ($("#g_slug").value || "").trim();
    if (!tema){ alert("Escribí un tema."); return; }
    busy(gGen, "Redactando");
    try {
      const g = await api("POST", { action:"guia_generar", slug, tema, linea });
      const realSlug = g.slug || slug;   // guia-generar puede derivar el slug del tema
      gGen.innerHTML = `<span class="spin"></span>Generando ${g.secciones.length} imágenes`;
      await Promise.all(g.secciones.map(s =>
        api("POST", { action:"guia_imagen", slug: realSlug, seccion_num: s.seccion_num, accion:"generar" })
          .catch(e => console.warn("img " + s.seccion_num + ": " + e.message))
      ));
      await reload(); route();
    } catch(e){ alert("No se pudo generar: " + e.message); unbusy(gGen); }
  }

  if (gAp){
    const [slug, num] = gAp.dataset.gap.split("|");
    busy(gAp, "Aprobando");
    try { await api("POST", { action:"guia_imagen", slug, seccion_num: Number(num), accion:"aprobar" }); await reload(); route(); }
    catch(e){ alert("Error: " + e.message); unbusy(gAp); }
  }

  if (gRe){
    const [slug, num] = gRe.dataset.gre.split("|");
    const inp = document.querySelector(`.g-ajuste[data-ajuste="${slug}|${num}"]`);
    // 1er clic: revela el campo de ajuste. 2do clic: rehace (con o sin ajuste).
    if (inp && !inp.classList.contains("show")){
      inp.classList.add("show"); inp.focus();
      gRe.textContent = "↻ Rehacer ahora";
      return;
    }
    const ajuste = inp ? inp.value.trim() : "";
    busy(gRe, "Rehaciendo");
    try { await api("POST", { action:"guia_imagen", slug, seccion_num: Number(num), accion:"rehacer", ajuste }); await reload(); route(); }
    catch(e){ alert("Error: " + e.message); unbusy(gRe); }
  }

  // Ampliar miniatura (lightbox)
  const zoom = ev.target.closest("[data-zoom]");
  if (zoom){
    const lb = $("#g_lightbox");
    lb.querySelector("img").src = zoom.dataset.zoom;
    lb.classList.add("show");
  }

  // Copiar link (botón con ícono — feedback por color + title)
  const cp = ev.target.closest("button[data-copy]");
  if (cp){
    try {
      await navigator.clipboard.writeText(cp.dataset.copy);
      cp.classList.add("done"); const t = cp.title; cp.title = "¡Copiado!";
      setTimeout(() => { cp.classList.remove("done"); cp.title = t; }, 1600);
    } catch(_) { window.prompt("Copiá el link:", cp.dataset.copy); }
  }

  if (gPub){
    const slug = gPub.dataset.gpub;
    if (!confirm("¿Publicar esta guía ahora? Sube el guia.html a Hostinger. No se puede deshacer desde acá.")) return;
    busy(gPub, "Publicando");
    try {
      const r = await api("POST", { action:"guia_publicar", slug });
      alert("Publicada:\n" + r.url);
      await reload(); route();
    } catch(e){ alert("No se pudo publicar: " + e.message); unbusy(gPub); }
  }
});

async function reload(){ DATA = await api("GET"); }

Panel.init({
  page: "contenido",
  onReady: async () => {
    $("#app").hidden = false;
    $("#topMsg").textContent = "Cargando…";
    try { await reload(); $("#topMsg").textContent = ""; route(); }
    catch(e){ $("#topMsg").className = "msg err"; $("#topMsg").textContent = "No se pudo cargar: " + e.message; }
  },
});
</script>
